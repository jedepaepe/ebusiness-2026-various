# ===================================================================
# Configuration de l'application Spring Boot
# ===================================================================
spring.application.name=devis-spring-boot-mvc
server.port=8080

# ===================================================================
# Configuration Base de Données SQLite Locale (devis.db)
# ===================================================================
spring.datasource.url=jdbc:sqlite:devis.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Configuration HikariCP optimisée pour SQLite (monoprocessus d'écriture)
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000

# ===================================================================
# Configuration Hibernate / JPA
# ===================================================================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Configuration Thymeleaf
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===================================================================
# Encodage HTTP
# ===================================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
